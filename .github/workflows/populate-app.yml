
name: 2 - Populate MARSA PDF Reader App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create PDF Reader Application
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/marsa/pdfreader

          cat > app/src/main/java/com/marsa/pdfreader/MainActivity.kt <<'KOTLIN'
          package com.marsa.pdfreader

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.pdf.PdfRenderer
          import android.net.Uri
          import android.os.Bundle
          import android.os.ParcelFileDescriptor
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import android.graphics.drawable.GradientDrawable

          class MainActivity : Activity() {

              private var descriptor: ParcelFileDescriptor? = null
              private var renderer: PdfRenderer? = null
              private var currentPage = 0
              private var pageCount = 0
              private var currentUri: Uri? = null

              private lateinit var pageView: PdfPageView
              private lateinit var pageLabel: TextView
              private lateinit var thumbnailContainer: LinearLayout
              private lateinit var emptyView: TextView

              private val backgroundColor = Color.rgb(13, 17, 27)
              private val surfaceColor = Color.rgb(25, 32, 46)
              private val accentColor = Color.rgb(65, 135, 255)
              private val textColor = Color.rgb(240, 244, 255)

              companion object {
                  private const val PICK_PDF = 1001
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = backgroundColor
                  window.navigationBarColor = backgroundColor

                  buildInterface()
              }

              private fun buildInterface() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(backgroundColor)
                      setPadding(dp(16), dp(12), dp(16), dp(12))
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  val title = TextView(this).apply {
                      text = "MARSA PDF Reader"
                      textSize = 23f
                      setTextColor(textColor)
                      setTypeface(null, android.graphics.Typeface.BOLD)
                  }

                  val subtitle = TextView(this).apply {
                      text = "Lightweight • Offline • Private"
                      textSize = 12f
                      setTextColor(Color.LTGRAY)
                      setPadding(0, dp(4), 0, dp(14))
                  }

                  header.addView(title)
                  header.addView(subtitle)
                  root.addView(header)

                  val toolbar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  toolbar.addView(
                      makeButton("Buka PDF", accentColor) {
                          choosePdf()
                      },
                      LinearLayout.LayoutParams(0, dp(46), 1f).apply {
                          marginEnd = dp(8)
                      }
                  )

                  toolbar.addView(
                      makeButton("Bagikan", surfaceColor) {
                          sharePdf()
                      },
                      LinearLayout.LayoutParams(0, dp(46), 1f)
                  )

                  root.addView(toolbar)

                  val viewer = FrameLayout(this).apply {
                      setBackgroundColor(Color.rgb(20, 25, 36))
                  }

                  pageView = PdfPageView(this)

                  emptyView = TextView(this).apply {
                      text = "Belum ada dokumen PDF\n\nKetuk Buka PDF untuk memilih dokumen."
                      textSize = 16f
                      gravity = Gravity.CENTER
                      setTextColor(Color.LTGRAY)
                  }

                  viewer.addView(
                      pageView,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  )

                  viewer.addView(
                      emptyView,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  )

                  root.addView(
                      viewer,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      ).apply {
                          topMargin = dp(14)
                          bottomMargin = dp(12)
                      }
                  )

                  val thumbnailScroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                  }

                  thumbnailContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  thumbnailScroll.addView(thumbnailContainer)

                  root.addView(
                      thumbnailScroll,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          dp(100)
                      )
                  )

                  val navigation = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setPadding(0, dp(12), 0, 0)
                  }

                  navigation.addView(
                      makeButton("‹ Sebelumnya", surfaceColor) {
                          showPage(currentPage - 1)
                      },
                      LinearLayout.LayoutParams(0, dp(48), 1f).apply {
                          marginEnd = dp(8)
                      }
                  )

                  pageLabel = TextView(this).apply {
                      text = "0 / 0"
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setTextColor(textColor)
                  }

                  navigation.addView(
                      pageLabel,
                      LinearLayout.LayoutParams(dp(65), dp(48))
                  )

                  navigation.addView(
                      makeButton("Berikutnya ›", surfaceColor) {
                          showPage(currentPage + 1)
                      },
                      LinearLayout.LayoutParams(0, dp(48), 1f).apply {
                          marginStart = dp(8)
                      }
                  )

                  root.addView(navigation)

                  setContentView(root)
              }

              private fun makeButton(
                  label: String,
                  color: Int,
                  action: () -> Unit
              ): Button {
                  return Button(this).apply {
                      text = label
                      textSize = 12f
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          setColor(color)
                          cornerRadius = dp(12).toFloat()
                      }
                      setOnClickListener { action() }
                  }
              }

              private fun choosePdf() {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "application/pdf"
                  }

                  startActivityForResult(intent, PICK_PDF)
              }

              @Deprecated("Use Activity Result API in a future update")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == PICK_PDF &&
                      resultCode == RESULT_OK &&
                      data?.data != null
                  ) {
                      val uri = data.data!!

                      try {
                          contentResolver.takePersistableUriPermission(
                              uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          )
                      } catch (_: Exception) {
                      }

                      openPdf(uri)
                  }
              }

              private fun openPdf(uri: Uri) {
                  try {
                      closePdf()

                      val fd = contentResolver.openFileDescriptor(uri, "r")
                          ?: throw Exception("Tidak dapat membuka file.")

                      descriptor = fd
                      renderer = PdfRenderer(fd)
                      currentUri = uri
                      pageCount = renderer!!.pageCount
                      currentPage = 0

                      emptyView.visibility = View.GONE

                      showPage(0)
                      buildThumbnails()

                      Toast.makeText(
                          this,
                          "PDF berhasil dibuka",
                          Toast.LENGTH_SHORT
                      ).show()

                  } catch (e: Exception) {
                      closePdf()

                      Toast.makeText(
                          this,
                          "Gagal membuka PDF: ${e.message}",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              private fun renderPage(index: Int): Bitmap {
                  val pdf = renderer ?: throw Exception("PDF belum dibuka.")

                  val page = pdf.openPage(index)

                  try {
                      val maxDimension = maxOf(page.width, page.height)
                      val scale = minOf(2f, 1600f / maxDimension)

                      val width = (page.width * scale).toInt().coerceAtLeast(1)
                      val height = (page.height * scale).toInt().coerceAtLeast(1)

                      val bitmap = Bitmap.createBitmap(
                          width,
                          height,
                          Bitmap.Config.ARGB_8888
                      )

                      bitmap.eraseColor(Color.WHITE)

                      page.render(
                          bitmap,
                          null,
                          null,
                          PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY
                      )

                      return bitmap
                  } finally {
                      page.close()
                  }
              }

              private fun showPage(index: Int) {
                  if (renderer == null) return
                  if (index !in 0 until pageCount) return

                  try {
                      currentPage = index

                      val bitmap = renderPage(index)
                      pageView.setBitmap(bitmap)

                      pageLabel.text = "${index + 1} / $pageCount"

                      highlightThumbnail(index)

                  } catch (e: Exception) {
                      Toast.makeText(
                          this,
                          "Gagal merender halaman: ${e.message}",
                          Toast.LENGTH_SHORT
                      ).show()
                  }
              }

              private fun buildThumbnails() {
                  thumbnailContainer.removeAllViews()

                  val limit = minOf(pageCount, 80)

                  for (i in 0 until limit) {
                      val bitmap = renderThumbnail(i)

                      val image = ImageView(this).apply {
                          setImageBitmap(bitmap)
                          scaleType = ImageView.ScaleType.FIT_CENTER
                          setPadding(dp(3), dp(3), dp(3), dp(3))
                          background = GradientDrawable().apply {
                              setColor(surfaceColor)
                              cornerRadius = dp(8).toFloat()
                          }

                          setOnClickListener {
                              showPage(i)
                          }
                      }

                      thumbnailContainer.addView(
                          image,
                          LinearLayout.LayoutParams(dp(64), dp(88)).apply {
                              marginEnd = dp(8)
                          }
                      )
                  }

                  if (pageCount > 80) {
                      Toast.makeText(
                          this,
                          "Thumbnail menampilkan 80 halaman pertama.",
                          Toast.LENGTH_SHORT
                      ).show()
                  }

                  highlightThumbnail(currentPage)
              }

              private fun renderThumbnail(index: Int): Bitmap {
                  val pdf = renderer!!
                  val page = pdf.openPage(index)

                  try {
                      val bitmap = Bitmap.createBitmap(
                          120,
                          160,
                          Bitmap.Config.ARGB_8888
                      )

                      bitmap.eraseColor(Color.WHITE)

                      val scale = minOf(
                          120f / page.width,
                          160f / page.height
                      )

                      val width = (page.width * scale).toInt()
                      val height = (page.height * scale).toInt()

                      val matrix = Matrix().apply {
                          setScale(scale, scale)
                      }

                      val canvas = Canvas(bitmap)
                      val left = (120 - width) / 2f
                      val top = (160 - height) / 2f

                      canvas.translate(left, top)

                      page.render(
                          bitmap,
                          null,
                          matrix,
                          PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY
                      )

                      return bitmap
                  } finally {
                      page.close()
                  }
              }

              private fun highlightThumbnail(index: Int) {
                  for (i in 0 until thumbnailContainer.childCount) {
                      val view = thumbnailContainer.getChildAt(i)

                      view.alpha = if (i == index) 1f else 0.55f

                      view.background = GradientDrawable().apply {
                          setColor(surfaceColor)
                          cornerRadius = dp(8).toFloat()
                          if (i == index) {
                              setStroke(dp(2), accentColor)
                          }
                      }
                  }
              }

              private fun sharePdf() {
                  val uri = currentUri

                  if (uri == null) {
                      Toast.makeText(
                          this,
                          "Buka PDF terlebih dahulu.",
                          Toast.LENGTH_SHORT
                      ).show()
                      return
                  }

                  val intent = Intent(Intent.ACTION_SEND).apply {
                      type = "application/pdf"
                      putExtra(Intent.EXTRA_STREAM, uri)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }

                  startActivity(
                      Intent.createChooser(intent, "Bagikan PDF")
                  )
              }

              private fun closePdf() {
                  pageView.setBitmap(null)

                  try {
                      renderer?.close()
                  } catch (_: Exception) {
                  }

                  renderer = null

                  try {
                      descriptor?.close()
                  } catch (_: Exception) {
                  }

                  descriptor = null
                  currentUri = null
                  pageCount = 0
                  currentPage = 0

                  if (::thumbnailContainer.isInitialized) {
                      thumbnailContainer.removeAllViews()
                  }

                  if (::pageLabel.isInitialized) {
                      pageLabel.text = "0 / 0"
                  }

                  if (::emptyView.isInitialized) {
                      emptyView.visibility = View.VISIBLE
                  }
              }

              private fun dp(value: Int): Int {
                  return (value * resources.displayMetrics.density).toInt()
              }

              override fun onDestroy() {
                  closePdf()
                  super.onDestroy()
              }

              private inner class PdfPageView(
                  context: android.content.Context
              ) : View(context) {

                  private var bitmap: Bitmap? = null
                  private var scale = 1f
                  private var offsetX = 0f
                  private var offsetY = 0f
                  private var lastX = 0f
                  private var lastY = 0f

                  private val paint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)

                  private val scaleDetector =
                      ScaleGestureDetector(context,
                          object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                              override fun onScale(
                                  detector: ScaleGestureDetector
                              ): Boolean {
                                  scale = (scale * detector.scaleFactor)
                                      .coerceIn(1f, 5f)
                                  invalidate()
                                  return true
                              }
                          }
                      )

                  fun setBitmap(newBitmap: Bitmap?) {
                      val old = bitmap
                      bitmap = newBitmap
                      scale = 1f
                      offsetX = 0f
                      offsetY = 0f

                      if (old != null && old !== newBitmap && !old.isRecycled) {
                          old.recycle()
                      }

                      invalidate()
                  }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)

                      val image = bitmap ?: return

                      val matrix = Matrix()
                      val left = (width - image.width * scale) / 2f + offsetX
                      val top = (height - image.height * scale) / 2f + offsetY

                      matrix.setScale(scale, scale)
                      matrix.postTranslate(left, top)

                      canvas.drawColor(Color.rgb(20, 25, 36))
                      canvas.drawBitmap(image, matrix, paint)
                  }

                  override fun onTouchEvent(event: MotionEvent): Boolean {
                      scaleDetector.onTouchEvent(event)

                      when (event.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              lastX = event.x
                              lastY = event.y
                          }

                          MotionEvent.ACTION_MOVE -> {
                              if (!scaleDetector.isInProgress && scale > 1f) {
                                  offsetX += event.x - lastX
                                  offsetY += event.y - lastY
                                  invalidate()
                              }

                              lastX = event.x
                              lastY = event.y
                          }

                          MotionEvent.ACTION_UP,
                          MotionEvent.ACTION_CANCEL -> performClick()
                      }

                      return true
                  }

                  override fun performClick(): Boolean {
                      super.performClick()
                      return true
                  }
              }
          }
          KOTLIN

      - name: Commit Application Code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/marsa/pdfreader/MainActivity.kt
          git diff --cached --quiet || git commit -m "Add MARSA PDF Reader application"
          git push
